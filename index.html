<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hokenchat</title>
<link rel="stylesheet" href="/static/fa/css/fontawesome.min.css">
<link rel="stylesheet" href="/static/fa/css/solid.min.css">
<link rel="stylesheet" href="/static/fa/css/regular.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="locked">
<!-- ログイン・初期設定（ログインするまで他の画面は出さない） -->
<div class="gate"><div class="box" id="gate"></div></div>

<aside>
  <div class="brand"><i>保</i>hokenchat</div>
  <div class="brand-sub">社内AIアシスタント（試作 第0.2版）</div>
  <nav id="nav">
    <div class="grp">業務</div>
    <button data-v="internal" data-p="chat"><i class="fa-regular fa-comments"></i>社内チャット</button>
    <button data-v="line" data-p="line"><i class="fa-regular fa-comment-dots"></i>公式LINE</button>
    <button data-v="customers" data-p="customer"><i class="fa-regular fa-address-book"></i>顧客DB</button>
    <button data-v="mailing" data-p="mailing"><i class="fa-regular fa-envelope"></i>郵送（送付状・封筒）</button>
    <button data-v="quotes" data-p="quote"><i class="fa-regular fa-file-lines"></i>見積依頼書</button>
    <button data-v="tasks" data-p="task"><i class="fa-regular fa-square-check"></i>タスク<span class="cnt" id="cnt-tasks" hidden></span></button>
    <div class="grp">文書</div>
    <button data-v="docs" data-p="docs.view"><i class="fa-solid fa-book"></i>登録文書（約款・規程）<span class="cnt" id="cnt-docs" hidden></span></button>
    <button data-v="vault" data-p="vault.list"><i class="fa-solid fa-box-archive"></i>文書保管庫（申込書控え）<span class="cnt" id="cnt-vault" hidden></span></button>
    <div class="grp" data-p="audit.view">管理</div>
    <button data-v="audit" data-p="audit.view"><i class="fa-solid fa-clock-rotate-left"></i>監査ログ</button>
    <button data-v="monthly" data-p="audit.view"><i class="fa-solid fa-clipboard-check"></i>月次点検</button>
    <button data-v="admin" data-p="staff.manage"><i class="fa-solid fa-user-gear"></i>社員・設定</button>
  </nav>
  <div class="status" id="status"><span class="dot"></span><span>確認中…</span><br>モデル：<span id="model">-</span><br>外部通信：なし／データ：架空</div>
</aside>

<main>
  <div class="top">
    <h1 id="title">社内チャット</h1><span class="sub" id="sub"></span>
    <label class="purpose" title="顧客情報を使う前に、何のために使うかを選びます（目的に必要な項目だけが表示されます）">利用目的
      <select id="purpose"></select></label>
    <button class="iconbtn" id="bell" title="通知"><i class="fa-regular fa-bell"></i><span class="badge" id="bellcnt" hidden></span></button>
    <span class="user" id="me"></span>
    <button class="iconbtn" id="pwbtn" title="パスワードの変更"><i class="fa-solid fa-key"></i></button>
    <button class="iconbtn" id="logout" title="ログアウト"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>
  <div class="stopbar" id="stopbar"><i class="fa-solid fa-circle-pause"></i> AIは管理者により停止中です。検索・分類・下書きなどAIを使う機能は止まっています。一覧・登録・印刷などは使えます。</div>

  <section class="view chat" id="v-internal">
    <div class="log" id="ilog"></div>
    <div class="composer"><div class="samples" id="isamples"></div>
      <form class="bar" id="iform"><input placeholder="約款・規程について質問（例：車両保険でタイヤだけパンクした場合は？）" autocomplete="off"><button>送信</button></form></div>
  </section>

  <section class="view" id="v-line">
    <div class="lwin">
      <div class="llist"><h3>トーク</h3><div class="search">本物のLINE（検証用アカウント）の1:1トーク</div><div id="lusers"></div></div>
      <div class="ltalk">
        <div class="lhead"><span id="lname">トークを選択してください</span>
          <div class="row" id="ltools" hidden>
            <button class="btn s" id="llink" title="本人確認のうえ顧客DBとひも付ける"><i class="fa-regular fa-id-card"></i><span>顧客とひも付け</span></button>
            <div class="seg" id="lmode"><button data-m="ai"><i class="fa-solid fa-robot"></i>AIモード</button><button data-m="manual"><i class="fa-regular fa-user"></i>手動モード</button></div>
          </div></div>
        <div class="log" id="lmsgs"></div>
        <div class="composer"><div class="hint2" id="lhint"></div>
          <form class="bar" id="lform"><textarea placeholder="担当者として返信（お客さまのLINEに届きます）" disabled></textarea>
            <div style="display:flex;flex-direction:column;gap:6px"><button type="button" class="btn s" id="ldraft" disabled title="承認済みの定型文から下書きを作る"><i class="fa-solid fa-wand-magic-sparkles"></i>AIの下書き</button>
            <button class="btn g" disabled>送信</button></div></form></div>
      </div>
    </div>
  </section>

  <section class="view" id="v-customers"><div class="pane" id="p-customers"></div></section>
  <section class="view" id="v-mailing"><div class="pane" id="p-mailing"></div></section>
  <section class="view" id="v-quotes"><div class="pane" id="p-quotes"></div></section>
  <section class="view" id="v-tasks"><div class="pane" id="p-tasks"></div></section>
  <section class="view" id="v-docs"><div class="pane" id="p-docs"></div></section>
  <section class="view" id="v-vault"><div class="pane" id="p-vault"></div></section>
  <section class="view" id="v-audit"><div class="pane" id="p-audit"></div></section>
  <section class="view" id="v-monthly"><div class="pane" id="p-monthly"></div></section>
  <section class="view" id="v-admin"><div class="pane" id="p-admin"></div></section>
</main>

<div class="drawer" id="drawer"></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<script src="/static/app.js"></script>
</body>
</html>
